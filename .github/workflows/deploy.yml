name: Deploy

# Builds master, publishes a GitHub release with the build attached, then deploys it to IIS on the self-hosted runner.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

# write: needed to create the tag and release.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    environment: production
    env:
      SITE_NAME: Filtarr
      SITE_DIR: C:\inetpub\wwwroot\filtarr.daviscode.com
    steps:
      # The runner context isn't available in job-level env, so the staging folder is exported from a step.
      - name: Set staging folder
        shell: powershell
        run: Add-Content $env:GITHUB_ENV "STAGE_DIR=$env:RUNNER_TEMP\filtarr-stage"

      # Full history so the generated release notes can compare against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, test and publish
        shell: powershell
        run: .\scripts\Build-Release.ps1 -OutputDir "$env:STAGE_DIR"

      #- name: Create GitHub release
      # shell: powershell
      # env:
      #   GH_TOKEN: ${{ github.token }}
      # run: |
      #   $tag = "v$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
      #   $zip = Join-Path $env:RUNNER_TEMP "Filtarr-$tag.zip"
      #
      #   Compress-Archive -Path "$env:STAGE_DIR\*" -DestinationPath $zip -Force
      #
      #   # --target pins the tag to the exact commit that was built; --generate-notes lists the merged PRs since the last release.
      #   gh release create $tag $zip --target "${{ github.sha }}" --title $tag --generate-notes
      #   if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Deploy to IIS
        shell: powershell
        run: |
          # app_offline.htm makes the ASP.NET Core module stop the app (releasing file locks) and serve a maintenance page;
          # removing it starts the app again, so no app pool restart (and no IIS admin rights for the runner) is needed.
          Set-Content "$env:SITE_DIR\app_offline.htm" "Updating, back in a moment."
          Start-Sleep -Seconds 3

          # /MIR makes the folder an exact copy; app_offline.htm and any data folders are excluded from deletion.
          robocopy "$env:STAGE_DIR" "$env:SITE_DIR" /MIR /XF app_offline.htm /XD data logs /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }

          Remove-Item "$env:SITE_DIR\app_offline.htm"

      - name: Smoke test
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          Invoke-WebRequest "http://localhost:5080/" -UseBasicParsing | Out-Null
